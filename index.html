<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background:#0a1222; color:white; font-family: sans-serif; display:flex; justify-content:center; padding:20px; }
.card { background:#162032; padding:25px; border-radius:20px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
h2 { margin:0 0 20px 0; font-size:28px; }
label { color:#a0aec0; font-size:14px; margin-top:15px; display:block; }
input { width:100%; background:#0f1a2e; border:1px solid #2d3a52; border-radius:12px; padding:14px; color:white; margin-top:8px; box-sizing:border-box; outline:none; }
input:focus { border-color:#7eb8ff; }
.btn { width:100%; padding:14px; border-radius:12px; border:none; font-weight:bold; font-size:16px; margin-top:15px; cursor:pointer; }
.btn-primary { background:#7eb8ff; color:#0a1222; }
.btn-secondary { background:#2d3a52; color:white; border:1px solid #3d4f6f; }
#status { margin-top:15px; text-align:center; font-size:13px; color:#7eb8ff; min-height:20px;}
.header { text-align:center; margin-bottom:30px; font-size:24px; font-weight:bold; }
</style>
</head>
<body>

<div style="width:100%">
<div class="header">🦅 FalconX Pay</div>
<div class="card">
  <h2>Send FLX</h2>
  <div id="status"></div>

  <label>Recipient Address</label>
  <input id="recipient" placeholder="0x...">

  <label>Amount</label>
  <input id="amount" type="number" placeholder="0.0">

  <button class="btn btn-primary" onclick="sendFLX()">Send FLX</button>
  <button class="btn btn-secondary" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
</div>
</div>

<script>
// SABON CODE MAI HADA WALLET NA GASKE
let userAccount = null;

async function connectWallet() {
  const status = document.getElementById("status");
  const btn = document.getElementById("connectBtn");

  if (typeof window.ethereum === 'undefined') {
    status.innerText = "❌ MetaMask ba a saka ba. Saka MetaMask da farko!";
    return;
  }

  try {
    btn.innerText = "Connecting...";
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    userAccount = accounts[0];
    status.innerText = "✅ Connected: " + userAccount.substring(0,6) + "..." + userAccount.substring(38);
    btn.innerText = "Connected ✓";
  } catch (e) {
    status.innerText = "❌ An ki amincewa da connection";
    btn.innerText = "Connect Wallet";
  }
}

function sendFLX() {
  const recipient = document.getElementById("recipient").value;
  const amount = document.getElementById("amount").value;
  const status = document.getElementById("status");

  if(!userAccount) {
    status.innerText = "⚠️ Da farko ka haɗa Wallet!";
    return;
  }
  if(recipient.length < 42) {
    status.innerText = "⚠️ Adireshin ba daidai bane!";
    return;
  }
  if(!amount || amount <= 0) {
    status.innerText = "⚠️ Saka adadin FLX!";
    return;
  }

  status.innerText = "⏳ Ana tura " + amount + " FLX zuwa " + recipient.substring(0,6) + "...";
  // Anan ne zaka saka code na contract din FLX dinka na gaske
}
</script>
</body>
</html>
