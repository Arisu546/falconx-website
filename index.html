<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FalconX — Payments, made simple.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      background: #11182d;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #78b7ff;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: #78b7ff;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(135deg, #0b1020, #14264a);
    }

    .hero h1 {
      font-size: 55px;
      color: #78b7ff;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      color: #c8d3e6;
    }

    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 24px;
      background: #247cff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    section {
      padding: 70px 8%;
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      color: #78b7ff;
      margin-bottom: 20px;
      font-size: 30px;
    }

    .card {
      background: #11182d;
      padding: 25px;
      border-radius: 12px;
      margin-top: 20px;
      border: 1px solid #263653;
    }

    .token-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .token-box {
      background: #11182d;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #263653;
    }

    .token-box strong {
      color: #78b7ff;
      display: block;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #070b16;
      color: #8794aa;
    }

      .hero h1 {
        font-size: 42px;
      }
