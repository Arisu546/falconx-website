<!DOCTYPE html>
<html>
<head>
<title>FalconX Pay - Global Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0e1f;color:white;font-family:Arial;text-align:center;padding:20px}
.card{background:#151a30;padding:25px;border-radius:15px;max-width:400px;margin:20px auto;border:1px solid #2a3a6a}
button{background:#3b82f6;color:white;padding:12px 20px;border:none;border-radius:8px;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
button:hover{background:#2563eb}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0}
.fee{color:#60a5fa;font-size:14px;margin-top:15px}
</style>
</head>
<body>
<img src="logo.png" style="width:120px;margin-bottom:10px">
<h2>FalconX Global Pay</h2>
<p style="color:#94a3b8">Fast • Secure • Worldwide</p>

<div class="card">
<button onclick="alert('Wallet Connected!')">🔗 Connect Wallet</button>
<input type="text" placeholder="Recipient Address">
<input type="number" placeholder="Amount (FLX)">
<button style="background:#10b981">Send Now</button>
<div class="fee">Network Fee: $0.03 only - Send anywhere in the world</div>
</div>

<p style="font-size:12px;color:#64748b">© 2026 FalconX Pay - GLOBAL • FAST • PAY</p>
</body>
</html>
