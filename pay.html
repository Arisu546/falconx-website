<!DOCTYPE html>
<html>
<head>
<title>FalconX Pay - BNB Global</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0e1f;color:white;font-family:Arial;text-align:center;padding:20px}
.card{background:#151a30;padding:25px;border-radius:15px;max-width:400px;margin:20px auto;border:1px solid #f3ba2f}
button{background:#f3ba2f;color:#000;padding:12px 20px;border:none;border-radius:8px;width:100%;font-size:16px;cursor:pointer;margin-top:10px;font-weight:bold}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0}
.fee{color:#f3ba2f;font-size:14px;margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<img src="logo.png" style="width:120px">
<h2>FalconX Pay on BNB</h2>
<p style="color:#94a3b8">Powered by BNB Smart Chain</p>

<div class="card">
<button id="walletBtn" onclick="connectWallet()">🔗 Connect Wallet</button>
<input type="text" placeholder="Recipient Address">
<input type="number" placeholder="Amount">
<button style="background:#10b981;color:white">Send Now</button>
<div class="fee">Fee: $0.03 | Chain: BNB Smart Chain | Global: 180+ Countries</div>
</div>

<script>
async function connectWallet(){
 if(window.ethereum){
   try{
     const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
     await window.ethereum.request({
       method: 'wallet_switchEthereumChain',
       params: [{ chainId: '0x38' }],
     }).catch(async ()=>{
       await window.ethereum.request({
         method: 'wallet_addEthereumChain',
         params: [{
           chainId: '0x38',
           chainName: 'BNB Smart Chain',
           nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
           rpcUrls: ['https://bsc-dataseed.binance.org/'],
           blockExplorerUrls: ['https://bscscan.com/']
         }],
       });
     });
     document.getElementById('walletBtn').innerText = '✅ Connected: ' + accounts[0].slice(0,6);
   }catch(e){alert('Error: ' + e.message)}
 }else{alert('Install Metamask or Trust Wallet')}
}
</script>

<p style="font-size:12px;color:#64748b">© 2026 FalconX - BNB Global Pay</p>
</body>
</html>
